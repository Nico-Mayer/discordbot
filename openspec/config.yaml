schema: spec-driven

context: |
  Personal Discordbot
  Tech stack: Go, Disgo (https://github.com/disgoorg/disgo)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

operations:
  propose:
    guidance:
      - After propose, review the proposed change in an independent subagent using the /subagent-spec-review skill
  apply:
    guidance:
      - After apply, review the change using the /subagent-code-review skill
