[tools]
go = "1.27.1"
goreleaser = "2.18.0"
"npm:@fission-ai/openspec" = "1.11.0"
svu = "3.4.1"
"aqua:runkids/skillshare" = "0.28"
hk = { version = "2", workflow = "release.yml" }

[settings]
skills.dir = ".agents/skills"
skills.auto_sync = true

[hooks]
postinstall = "mise run setup"

[tasks.setup]
description = "Sync agent skills and install git hooks (skipped in CI)"
shell = "bash -c"
run = """
[ -n "$CI" ] && exit 0
skillshare init
mise run skills:sync
hk install
"""

[tasks."skills:mise"]
description = "Sync mise skills"
hide = true
run = [
  "mise skills sync",
  "mise skills sync --dir .claude/skills",
]

[tasks."skills:skillshare"]
description = "Sync skillshare skills"
run = [
  "skillshare install -p",
  "skillshare sync -p",
]

[tasks."skills:openspec"]
description = "Sync openspec skills"
hide = true
run = [
  "openspec init --tools claude",
  "openspec init --tools agents",
]

[tasks."skills:sync"]
description = "Sync all skills"
# Sequential: subtasks write to the same skill dirs
run = [
  { task = "skills:mise" },
  { task = "skills:skillshare" },
  { task = "skills:openspec" },
]

[tasks.build]
description = "Compile every package"
run = "go build ./..."

[tasks.fmt]
description = "Fail if any file is not gofmt'd"
shell = "bash -c"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "not gofmt'd:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.test]
description = "Run tests with the race detector"
run = "go test -race ./..."

[tasks.coverage]
description = "Report total statement coverage (no threshold gate)"
shell = "bash -c"
run = '''
go test -coverprofile=coverage.out ./...
go tool cover -func=coverage.out | tail -n 1
'''

[tasks.check]
description = "Build, format, vet, test and report coverage"
run = [
  "mise run build",
  "mise run fmt",
  "mise run vet",
  "mise run test",
  "mise run coverage",
]

[tasks.release-snapshot]
description = "Build binaries, archives and a local image without publishing anything"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Tag the next version and push it; CI checks, builds and publishes"
shell = "bash -c"
run = '''
[ "$(git branch --show-current)" = main ] || { echo "release from main"; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "working tree is not clean"; exit 1; }
tag=$(svu next --v0)
echo "releasing $tag"
git tag -a "$tag" -m "release $tag" && git push origin "$tag"
'''
